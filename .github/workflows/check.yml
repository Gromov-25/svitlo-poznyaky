name: DTEK address monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Check addresses
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TELEGRAM_CHANNEL: "@Poznyaky_Svitlo24"
          DTEK_CITY: "м. Київ"
          DTEK_STREET_HINT: "Драгоманова"
        run: python main.py
      - name: Save status
        run: |
          if ! git diff --quiet -- state.json; then
            git config user.name "svitlo-monitor"
            git config user.email "actions@users.noreply.github.com"
            git add state.json
            git commit -m "Update last DTEK status"
            git push
          fi
